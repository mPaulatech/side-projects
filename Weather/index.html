<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Previsão do Tempo</title>
    <meta
      name="description"
      content="Consulte a previsão do tempo da sua cidade com dados atualizados."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Brisa, início">brisa</a>
        <form class="search" id="search-form" autocomplete="off">
          <label class="sr-only" for="city-input">Buscar cidade</label>
          <div class="search-field">
            <input
              id="city-input"
              name="city"
              type="text"
              placeholder="Buscar cidade"
              required
            />
            <ul class="suggestions" id="suggestions" hidden></ul>
          </div>
          <button type="submit" id="search-button" aria-label="Buscar cidade">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M20 20l-3.5-3.5" />
            </svg>
            <span class="sr-only">Buscar</span>
          </button>
        </form>
      </header>

      <main>
        <p class="status" id="status" role="status" aria-live="polite"></p>

        <section class="current" id="current" aria-labelledby="city-name" hidden>
          <div class="current-place">
            <p class="weather-date" id="weather-date"></p>
            <h1 id="city-name"></h1>
            <p class="country" id="country-name"></p>
          </div>
          <div class="current-icon" id="current-icon" aria-hidden="true"></div>
          <p class="temp" id="temperature"></p>
          <div class="weather-copy">
            <p class="condition" id="condition"></p>
            <p class="high-low" id="high-low"></p>
          </div>
          <div class="current-meta">
            <div class="metric">
              <span class="meta-label">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0Z" />
                  <path d="M12 11v7" />
                </svg>
                Sensação térmica
              </span>
              <strong id="feels-like"></strong>
            </div>
            <div class="metric">
              <span class="meta-label">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" />
                </svg>
                Umidade
              </span>
              <strong id="humidity"></strong>
            </div>
            <div class="metric">
              <span class="meta-label">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 8h13a3 3 0 1 0-3-3" />
                  <path d="M3 12h16a3 3 0 1 1-3 3" />
                  <path d="M3 16h8" />
                </svg>
                Vento
              </span>
              <strong id="wind"></strong>
            </div>
            <div class="metric">
              <span class="meta-label">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 16a8 8 0 1 1 16 0" />
                  <path d="m12 12 4-3" />
                </svg>
                Pressão
              </span>
              <strong id="pressure"></strong>
            </div>
          </div>
        </section>

        <section class="forecast" id="forecast" aria-labelledby="forecast-title" hidden>
          <h2 id="forecast-title">Olhando adiante</h2>
          <div class="forecast-grid" id="forecast-grid"></div>
        </section>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
