<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Previsão do Tempo</title>
    <meta
      name="description"
      content="Consulte a previsão do tempo da sua cidade com dados atualizados."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1>Previsão do Tempo</h1>
        <p>Obtenha informações precisas do clima da sua cidade</p>
      </header>

      <form class="search" id="search-form" autocomplete="off">
        <label class="sr-only" for="city-input">Buscar cidade</label>
        <div class="search-field">
          <input
            id="city-input"
            name="city"
            type="text"
            placeholder="Busque uma cidade (ex.: São Paulo, Rio de Janeiro, Curitiba...)"
            required
          />
          <ul class="suggestions" id="suggestions" hidden></ul>
        </div>
        <button type="submit" id="search-button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          Buscar
        </button>
      </form>

      <p class="status" id="status" role="status"></p>

      <section class="current" id="current" hidden>
        <div class="current-main">
          <div>
            <h2 id="city-name"></h2>
            <p class="country" id="country-name"></p>
            <p class="temp" id="temperature"></p>
            <p class="condition" id="condition"></p>
            <p class="feels-like" id="feels-like"></p>
          </div>
          <div class="current-icon" id="current-icon"></div>
        </div>
        <div class="current-meta">
          <div>
            <span class="meta-label">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" />
              </svg>
              Umidade
            </span>
            <strong id="humidity"></strong>
          </div>
          <div>
            <span class="meta-label">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 8h13a3 3 0 1 0-3-3" />
                <path d="M3 12h16a3 3 0 1 1-3 3" />
                <path d="M3 16h8" />
              </svg>
              Velocidade do vento
            </span>
            <strong id="wind"></strong>
          </div>
        </div>
      </section>

      <section class="forecast" id="forecast" hidden>
        <h3>Previsão de 5 dias</h3>
        <div class="forecast-grid" id="forecast-grid"></div>
      </section>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
